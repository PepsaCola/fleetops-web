<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FleetOps — fleet operations: live map, dispatch, maintenance and costs."
    />
    <title>FleetOps</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      // Keep the key in sync with THEME_STORAGE_KEY in src/shared/lib/theme/model.ts
      ;(function () {
        try {
          var theme = localStorage.getItem('fleetops-theme')
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/entrypoint/main.tsx"></script>
  </body>
</html>
