name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes a run still going pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, lint, FSD, format, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The client is generated from the contract snapshot; both must be committed together
      - name: API client matches the contract
        run: |
          npm run api:gen
          git diff --exit-code src/shared/api/generated
